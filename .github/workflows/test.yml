name: House checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        # Python 3.9 has no setup-python build for Ubuntu 26.04.
        os: [ubuntu-24.04, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: skill/scripts
      - run: node tests/web_session_smoke.js
  windows-connection:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_connections.py -v
      - run: python -m unittest discover -s tests -p test_session_bridge.py -v
      - run: python -m unittest discover -s tests -p test_storage.py -v
      - run: python -m unittest discover -s tests -p test_install.py -k windows -v
    env:
      PYTHONPATH: skill/scripts
      PYTHONUTF8: '1'
